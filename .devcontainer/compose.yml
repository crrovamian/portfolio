services:
  portfolio:
    env_file:
      - .env.test
      - .env
    container_name: portfolio
    tty: true
    build:
      context: .
      args:
        - GIT_USER_EMAIL=${GIT_USER_EMAIL}
        - GIT_USER_NAME=${GIT_USER_NAME}
    volumes:
      - /usr/bin/docker:/usr/bin/docker
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/api
      - ${SSH_AUTH_SOCK}:/ssh-agent
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ../.lazyvim/plugins:/root/.config/nvim/lua/plugins:cached
      - ../.lazyvim/config/keymaps.lua:/root/.config/nvim/lua/config/keymaps.lua
      - ../.lazyvim/config/options.lua:/root/.config/nvim/lua/config/options.lua
      - ../opencode:/root/.local/share/opencode
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}
    # links:
      # - order-postgres
    # ports:
      # - "3000:3000"
      # - "4200:4200"
    environment:
      SSH_AUTH_SOCK: /ssh-agent
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      GH_TOKEN: ${GH_TOKEN}
